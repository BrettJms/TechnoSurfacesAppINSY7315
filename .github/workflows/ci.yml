name: CI
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Unit tests
        run: >
          dotnet test tests/TechnoSurfaces.UnitTests -c Release --no-build
          --logger trx --collect:"XPlat Code Coverage" --results-directory results/unit
      - name: Integration tests
        if: hashFiles('tests/TechnoSurfaces.IntegrationTests/*.csproj') != ''
        run: >
          dotnet test tests/TechnoSurfaces.IntegrationTests -c Release --no-build
          --logger trx --collect:"XPlat Code Coverage" --results-directory results/integration
      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"results/**/coverage.cobertura.xml" -targetdir:results/coverage -reporttypes:MarkdownSummaryGithub || true
          cat results/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results
      - name: Publish
        run: dotnet publish TechnoSurfacesApp/TechnoSurfacesApp.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
